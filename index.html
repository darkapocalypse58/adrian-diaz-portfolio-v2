<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090a09" />
    <title>Adrian Diaz — Horizontal Portfolio Concept</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        document.body.innerHTML = '<pre id="startup-error" style="color:#ffcf48;padding:32px;white-space:pre-wrap">React startup error: ' + event.message + '</pre>';
      });
      window.addEventListener('unhandledrejection', function (event) {
        document.body.innerHTML = '<pre id="startup-error" style="color:#ffcf48;padding:32px;white-space:pre-wrap">React startup error: ' + event.reason + '</pre>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
